name: Verify Movie Mentor Journey Mutator Quarantine

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/verify-movie-mentor-journey-mutator-quarantine.mjs"
      - ".github/workflows/verify-movie-mentor-journey-mutator-quarantine.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/verify-movie-mentor-journey-mutator-quarantine.mjs"
      - ".github/workflows/verify-movie-mentor-journey-mutator-quarantine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journey-mutator-quarantine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify raw Journey progression mutators stay quarantined
        run: node scripts/verify-movie-mentor-journey-mutator-quarantine.mjs
