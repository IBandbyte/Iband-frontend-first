name: Verify Movie Mentor Durable Settlement Idempotency

on:
  pull_request:
    branches: [main]
    paths:
      - "src/components/studio/CreatorWorkspace.jsx"
      - "src/components/studio/mentor/CreatorMemoryCore.js"
      - "src/components/studio/mentor/CreatorMemory.js"
      - "src/components/studio/mentor/MovieMentorStudioIdentityRuntime.js"
      - "scripts/verify-movie-mentor-durable-settlement-idempotency.mjs"
      - "scripts/verify-movie-mentor-strict-durable-settlement-idempotency.mjs"
      - "scripts/verify-movie-mentor-strict-recommendation-lifecycle.mjs"
      - "scripts/verify-movie-mentor-strict-live-recommendation-provenance.mjs"
      - "scripts/verify-movie-mentor-recommendation-reference-evidence.mjs"
      - ".github/workflows/verify-movie-mentor-durable-settlement-idempotency.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify durable mentor settlement idempotency
        run: node scripts/verify-movie-mentor-durable-settlement-idempotency.mjs

      - name: Verify strict Studio settlement injection migration
        run: node scripts/verify-movie-mentor-strict-durable-settlement-idempotency.mjs

      - name: Verify strict recommendation retirement and reload
        run: node scripts/verify-movie-mentor-strict-recommendation-lifecycle.mjs

      - name: Verify strict live recommendation provenance
        run: node scripts/verify-movie-mentor-strict-live-recommendation-provenance.mjs

      - name: Verify original recommendation reference evidence migration
        run: node scripts/verify-movie-mentor-recommendation-reference-evidence.mjs
