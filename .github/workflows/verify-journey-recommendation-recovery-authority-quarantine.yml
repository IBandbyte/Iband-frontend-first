name: Verify Journey Recommendation Recovery Authority Quarantine

on:
  push:
    paths:
      - "src/components/studio/mentor/JourneyRecommendationLifecycleRecovery.js"
      - "scripts/verify-journey-recommendation-recovery-authority-quarantine.mjs"
      - ".github/workflows/verify-journey-recommendation-recovery-authority-quarantine.yml"
  pull_request:
    paths:
      - "src/components/studio/mentor/JourneyRecommendationLifecycleRecovery.js"
      - "scripts/verify-journey-recommendation-recovery-authority-quarantine.mjs"
      - ".github/workflows/verify-journey-recommendation-recovery-authority-quarantine.yml"

jobs:
  recovery-authority-quarantine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify recovery authority quarantine
        run: node scripts/verify-journey-recommendation-recovery-authority-quarantine.mjs
