name: Repair ResponseGenerator ESM Imports

on:
  push:
    paths:
      - '.github/workflows/maintenance-repair-response-generator-esm.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Repair extensionless local imports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/studio/mentor/ResponseGenerator.js')
          text = path.read_text()
          replacements = {
              'from "./AdaptiveMentorEngine";': 'from "./AdaptiveMentorEngine.js";',
              'from "./ResponseComposer";': 'from "./ResponseComposer.js";',
              'from "./CommunicationVoiceEngine";': 'from "./CommunicationVoiceEngine.js";',
              'from "./CreatorMemory";': 'from "./CreatorMemory.js";',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected import: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm i --no-audit --no-fund
      - name: Verify closed loop
        run: npm run verify:movie-mentor
      - name: Verify live Journey projection
        run: node scripts/verify-movie-mentor-live-journey-projection.mjs
      - name: Build frontend
        run: npm run build
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/studio/mentor/ResponseGenerator.js
          git commit -m 'Repair ResponseGenerator ESM imports' || exit 0
          git push origin HEAD:main
