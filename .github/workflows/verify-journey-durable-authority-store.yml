name: Verify Journey Durable Authority Store

on:
  push:
    paths:
      - "src/components/studio/mentor/JourneyDurableAuthorityStore.js"
      - "src/components/studio/mentor/JourneyProgressionProjectLock.js"
      - "scripts/verify-journey-durable-authority-store.mjs"
      - ".github/workflows/verify-journey-durable-authority-store.yml"
  pull_request:
    paths:
      - "src/components/studio/mentor/JourneyDurableAuthorityStore.js"
      - "src/components/studio/mentor/JourneyProgressionProjectLock.js"
      - "scripts/verify-journey-durable-authority-store.mjs"
      - ".github/workflows/verify-journey-durable-authority-store.yml"

jobs:
  journey-authority-store:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Torture Journey durable authority store
        run: node scripts/verify-journey-durable-authority-store.mjs
