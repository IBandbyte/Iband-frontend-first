name: Verify Journey Recommendation Atomic Integration

on:
  push:
    paths:
      - "src/components/studio/mentor/JourneyProgressionExecutionRuntime.js"
      - "src/components/studio/mentor/JourneyRecommendationAcceptanceExecutionRuntime.js"
      - "src/components/studio/mentor/JourneyRecommendationLifecyclePersistence.js"
      - "scripts/verify-journey-recommendation-atomic-integration.mjs"
      - ".github/workflows/verify-journey-recommendation-atomic-integration.yml"
  pull_request:
    paths:
      - "src/components/studio/mentor/JourneyProgressionExecutionRuntime.js"
      - "src/components/studio/mentor/JourneyRecommendationAcceptanceExecutionRuntime.js"
      - "src/components/studio/mentor/JourneyRecommendationLifecyclePersistence.js"
      - "scripts/verify-journey-recommendation-atomic-integration.mjs"
      - ".github/workflows/verify-journey-recommendation-atomic-integration.yml"

jobs:
  atomic-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify atomic recommendation lifecycle integration
        run: node scripts/verify-journey-recommendation-atomic-integration.mjs
