name: Verify Journey Authority Active Project Overlay

on:
  push:
    paths:
      - "src/components/studio/mentor/CreatorMemory.js"
      - "src/components/studio/mentor/JourneyAuthorityReadFacade.js"
      - "scripts/verify-journey-authority-active-project-overlay.mjs"
      - ".github/workflows/verify-journey-authority-active-project-overlay.yml"
  pull_request:
    paths:
      - "src/components/studio/mentor/CreatorMemory.js"
      - "src/components/studio/mentor/JourneyAuthorityReadFacade.js"
      - "scripts/verify-journey-authority-active-project-overlay.mjs"
      - ".github/workflows/verify-journey-authority-active-project-overlay.yml"

jobs:
  authority-active-project-overlay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Torture authority-aware active project reads
        run: node scripts/verify-journey-authority-active-project-overlay.mjs
