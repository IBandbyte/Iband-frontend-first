name: Verify Movie Mentor Reload Commit Timestamp Stability
on:
  push:
    branches:
      - verify/response-memory-injection-courts-6c98ab76
  workflow_dispatch:
jobs:
  timestamp-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify reload preserves committed timestamp
        run: node scripts/verify-movie-mentor-reload-commit-timestamp-stability.mjs
