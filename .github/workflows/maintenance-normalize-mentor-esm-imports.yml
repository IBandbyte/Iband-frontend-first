name: Normalize Mentor ESM Imports

on:
  push:
    paths:
      - '.github/workflows/maintenance-normalize-mentor-esm-imports.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Normalize resolvable relative imports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('src/components/studio/mentor')]
          changed = []
          pattern = re.compile(r'(?P<prefix>\bfrom\s+|\bimport\s+)(?P<quote>["\'])(?P<spec>\.{1,2}/[^"\']+)(?P=quote)')

          def resolve_spec(path, spec):
              if Path(spec).suffix:
                  return None
              base = (path.parent / spec)
              for suffix in ('.js', '.jsx', '.mjs'):
                  candidate = Path(str(base) + suffix)
                  if candidate.exists():
                      return spec + suffix
              return None

          for root in roots:
              for path in sorted(root.rglob('*')):
                  if path.suffix not in {'.js', '.jsx', '.mjs'}:
                      continue
                  text = path.read_text()
                  def repl(match):
                      replacement = resolve_spec(path, match.group('spec'))
                      if not replacement:
                          return match.group(0)
                      return f"{match.group('prefix')}{match.group('quote')}{replacement}{match.group('quote')}"
                  updated = pattern.sub(repl, text)
                  if updated != text:
                      path.write_text(updated)
                      changed.append(str(path))

          print('Normalized files:')
          for name in changed:
              print(name)
          if not changed:
              raise SystemExit('No resolvable extensionless Mentor imports were found.')
          PY
      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm i --no-audit --no-fund
      - name: Verify closed loop
        run: npm run verify:movie-mentor
      - name: Verify live Journey projection
        run: node scripts/verify-movie-mentor-live-journey-projection.mjs
      - name: Build frontend
        run: npm run build
      - name: Commit normalization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/studio/mentor
          git commit -m 'Normalize Movie Mentor ESM imports' || exit 0
          git push origin HEAD:main
