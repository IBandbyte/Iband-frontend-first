name: Verify Movie Mentor Creator-Facing Live

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-movie-mentor-creator-facing-live.yml"
      - "scripts/verify-movie-mentor-creator-facing-live.mjs"
      - "src/components/studio/CreatorWorkspace.jsx"
      - "src/components/studio/mentor/MovieMentorCreatorFacingPresenter.js"
      - "src/components/studio/mentor/MovieMentorResponseService.js"
      - "src/components/studio/mentor/MovieMentorAgentOrchestrator.js"
      - "src/components/studio/mentor/MovieJourneyIntelligenceBridge.js"
      - "src/components/studio/mentor/CreatorJourneyEngine.js"

permissions:
  contents: write

jobs:
  live-creator-facing-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Backend semantic/synthesis changes deploy independently on Render; allow provider reset/readiness too.
      - name: Wait for Render backend deployment
        run: sleep 100
      - name: Verify live creator-facing Movie Mentor pipeline
        continue-on-error: true
        env:
          IBAND_LIVE_BACKEND_URL: https://iband-backend-first-1.onrender.com
          IBAND_LIVE_REPORT_PATH: verification-results/movie-mentor-creator-facing-live.json
        run: node scripts/verify-movie-mentor-creator-facing-live.mjs
      - name: Commit verification report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification-results/movie-mentor-creator-facing-live.json
          if git diff --cached --quiet; then
            echo "No verification report change to commit."
          else
            git commit -m "test: record live Movie Mentor creator-facing verification"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Enforce live verification result
        run: |
          node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync("verification-results/movie-mentor-creator-facing-live.json","utf8")); console.log(JSON.stringify(r,null,2)); if(!r.passed) process.exit(1);'
