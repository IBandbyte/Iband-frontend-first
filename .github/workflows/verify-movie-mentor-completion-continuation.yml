name: Verify Movie Mentor Completion Continuation

on:
  push:
    paths:
      - "src/components/studio/CreatorWorkspace.jsx"
      - "src/components/studio/mentor/MovieMentorConversation.jsx"
      - "src/components/studio/mentor/JourneyPositionAuthorityControl.js"
      - "src/components/studio/mentor/JourneyProgressionExecutionRuntime.js"
      - "scripts/verify-movie-mentor-completion-continuation.mjs"
      - ".github/workflows/verify-movie-mentor-completion-continuation.yml"
  pull_request:
    paths:
      - "src/components/studio/CreatorWorkspace.jsx"
      - "src/components/studio/mentor/MovieMentorConversation.jsx"
      - "src/components/studio/mentor/JourneyPositionAuthorityControl.js"
      - "src/components/studio/mentor/JourneyProgressionExecutionRuntime.js"
      - "scripts/verify-movie-mentor-completion-continuation.mjs"
      - ".github/workflows/verify-movie-mentor-completion-continuation.yml"

jobs:
  completion-continuation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify creator-owned completion continuation
        run: node scripts/verify-movie-mentor-completion-continuation.mjs
