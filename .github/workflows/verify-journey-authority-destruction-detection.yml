name: Verify Journey Authority Destruction Detection

on:
  push:
    paths:
      - "src/components/studio/mentor/JourneyDurableAuthorityStore.js"
      - "src/components/studio/mentor/JourneyAuthoritySovereigntyLineage.js"
      - "scripts/verify-journey-authority-destruction-detection.mjs"
      - ".github/workflows/verify-journey-authority-destruction-detection.yml"
  workflow_dispatch:

jobs:
  destruction-detection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Torture authority destruction detection
        run: node scripts/verify-journey-authority-destruction-detection.mjs
