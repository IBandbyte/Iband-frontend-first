name: Verify Movie Mentor Journey Position Authority

on:
  push:
    branches: [main]
    paths:
      - "src/components/studio/mentor/JourneyPositionAuthorityControl.js"
      - "scripts/verify-movie-mentor-journey-position-authority.mjs"
      - ".github/workflows/verify-movie-mentor-journey-position-authority.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/components/studio/mentor/JourneyPositionAuthorityControl.js"
      - "scripts/verify-movie-mentor-journey-position-authority.mjs"
      - ".github/workflows/verify-movie-mentor-journey-position-authority.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journey-position-authority:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify pure Journey position authority control
        run: node scripts/verify-movie-mentor-journey-position-authority.mjs
