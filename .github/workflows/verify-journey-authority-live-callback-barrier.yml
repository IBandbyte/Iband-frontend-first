name: Verify Journey Authority Live Callback Barrier

on:
  push:
    paths:
      - "src/components/studio/CreatorWorkspace.jsx"
      - "src/components/studio/mentor/MovieMentorConversation.jsx"
      - "src/components/studio/mentor/MovieMentorJourneyProjectionRuntime.js"
      - "scripts/verify-journey-authority-live-callback-barrier.mjs"
      - ".github/workflows/verify-journey-authority-live-callback-barrier.yml"
  pull_request:
    paths:
      - "src/components/studio/CreatorWorkspace.jsx"
      - "src/components/studio/mentor/MovieMentorConversation.jsx"
      - "src/components/studio/mentor/MovieMentorJourneyProjectionRuntime.js"
      - "scripts/verify-journey-authority-live-callback-barrier.mjs"
      - ".github/workflows/verify-journey-authority-live-callback-barrier.yml"

jobs:
  live-callback-barrier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Torture live Journey Authority callback barrier
        run: node scripts/verify-journey-authority-live-callback-barrier.mjs
