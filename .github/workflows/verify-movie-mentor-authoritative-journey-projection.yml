name: Verify Movie Mentor Authoritative Journey Projection

on:
  push:
    paths:
      - "src/components/studio/mentor/CreatorJourneyAuthoritativeProjection.js"
      - "src/components/studio/mentor/CreatorJourneyEngine.js"
      - "scripts/verify-movie-mentor-authoritative-journey-projection.mjs"
      - ".github/workflows/verify-movie-mentor-authoritative-journey-projection.yml"
  pull_request:
    paths:
      - "src/components/studio/mentor/CreatorJourneyAuthoritativeProjection.js"
      - "src/components/studio/mentor/CreatorJourneyEngine.js"
      - "scripts/verify-movie-mentor-authoritative-journey-projection.mjs"
      - ".github/workflows/verify-movie-mentor-authoritative-journey-projection.yml"
  workflow_dispatch:

jobs:
  verify-authoritative-journey-projection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify authoritative Journey projection
        run: node scripts/verify-movie-mentor-authoritative-journey-projection.mjs
