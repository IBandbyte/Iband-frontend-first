name: Verify Movie Mentor Journey Planning Evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/components/studio/CreatorWorkspace.jsx"
      - "src/components/studio/mentor/MovieJourneyIntelligenceBridge.js"
      - "scripts/verify-movie-mentor-journey-planning-evidence.mjs"
      - ".github/workflows/verify-movie-mentor-journey-planning-evidence.yml"

permissions:
  contents: read

jobs:
  verify-journey-planning-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm i --no-audit --no-fund

      - name: Verify Journey planning evidence authority
        run: node scripts/verify-movie-mentor-journey-planning-evidence.mjs
