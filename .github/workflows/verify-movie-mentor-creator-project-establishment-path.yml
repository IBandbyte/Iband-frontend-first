name: Verify Movie Mentor Creator Project Establishment Path

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/verify-movie-mentor-creator-project-establishment-path.mjs"
      - "src/components/studio/CreatorWorkspace.jsx"
      - "src/components/studio/mentor/MovieMentorConversation.jsx"
      - "src/components/studio/mentor/MovieMentorConversationCore.jsx"
      - "src/components/studio/mentor/MovieMentorProjectEstablishmentAuthority.js"
      - "src/components/studio/mentor/MovieMentorTurnClient.js"
      - "src/components/studio/mentor/MovieMentorLiveGatewayService.js"
      - ".github/workflows/verify-movie-mentor-creator-project-establishment-path.yml"
  push:
    branches: [main]
    paths:
      - "scripts/verify-movie-mentor-creator-project-establishment-path.mjs"
      - "src/components/studio/CreatorWorkspace.jsx"
      - "src/components/studio/mentor/MovieMentorConversation.jsx"
      - "src/components/studio/mentor/MovieMentorConversationCore.jsx"
      - "src/components/studio/mentor/MovieMentorProjectEstablishmentAuthority.js"
      - "src/components/studio/mentor/MovieMentorTurnClient.js"
      - "src/components/studio/mentor/MovieMentorLiveGatewayService.js"
      - ".github/workflows/verify-movie-mentor-creator-project-establishment-path.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify creator project establishment path
        run: node scripts/verify-movie-mentor-creator-project-establishment-path.mjs
