name: Verify Movie Mentor Acceptance Reload Reality

on:
  push:
    paths:
      - "src/components/studio/CreatorWorkspace.jsx"
      - "src/components/studio/mentor/MovieMentorStudioIdentityRuntime.js"
      - "src/components/studio/mentor/JourneyRecommendationActionSurface.js"
      - "src/components/studio/mentor/JourneyRecommendationAcceptanceExecutionRuntime.js"
      - "scripts/verify-movie-mentor-acceptance-reload-reality.mjs"
      - ".github/workflows/verify-movie-mentor-acceptance-reload-reality.yml"
  pull_request:
    paths:
      - "src/components/studio/CreatorWorkspace.jsx"
      - "src/components/studio/mentor/MovieMentorStudioIdentityRuntime.js"
      - "src/components/studio/mentor/JourneyRecommendationActionSurface.js"
      - "src/components/studio/mentor/JourneyRecommendationAcceptanceExecutionRuntime.js"
      - "scripts/verify-movie-mentor-acceptance-reload-reality.mjs"
      - ".github/workflows/verify-movie-mentor-acceptance-reload-reality.yml"

jobs:
  acceptance-reload-reality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify acceptance reload reality
        run: node scripts/verify-movie-mentor-acceptance-reload-reality.mjs
