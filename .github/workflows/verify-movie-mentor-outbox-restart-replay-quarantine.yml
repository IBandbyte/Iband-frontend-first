name: Verify Movie Mentor Outbox Restart Replay Quarantine
on:
  push:
    branches:
      - verify/response-memory-injection-courts-6c98ab76
  workflow_dispatch:
jobs:
  restart-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify persisted pending outbox cannot self-authorise replay
        run: node scripts/verify-movie-mentor-outbox-restart-replay-quarantine.mjs
