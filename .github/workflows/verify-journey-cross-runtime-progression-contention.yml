name: Verify Journey Cross Runtime Progression Contention
on:
  push:
    branches:
      - verify/journey-cross-runtime-court-8d46430e
  workflow_dispatch:
jobs:
  physical-cross-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Execute isolated cross-runtime progression contention court
        run: node scripts/verify-journey-cross-runtime-progression-contention.mjs
