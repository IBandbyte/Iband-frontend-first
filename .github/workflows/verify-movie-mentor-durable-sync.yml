name: Movie Mentor Durable Sync Verification
on:
  push:
    branches: [main]
    paths:
      - "src/components/studio/mentor/MovieMentorConversation.jsx"
      - "src/components/studio/mentor/MovieMentorDurableStateSync.js"
      - "src/components/studio/mentor/MovieMentorTurnClient.js"
      - "src/components/studio/mentor/MovieMentorLiveGatewayService.js"
      - "src/components/studio/mentor/MovieMentorProjectIdentity.js"
      - "src/components/studio/mentor/CreatorMemory.js"
      - "src/App.jsx"
      - "src/main.jsx"
      - "scripts/verify-movie-mentor-durable-state-sync.mjs"
      - "scripts/verify-movie-mentor-live-gateway.mjs"
      - "scripts/verify-movie-mentor-single-brain.mjs"
      - "scripts/verify-movie-mentor-conversation-parity.mjs"
      - "scripts/verify-movie-mentor-project-identity.mjs"
      - "package.json"
      - ".github/workflows/verify-movie-mentor-durable-sync.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm i --no-audit --no-fund
      - name: Verify Movie Mentor invalid durable acknowledgement
        run: node scripts/verify-movie-mentor-invalid-durable-acknowledgement.mjs
      - name: Verify stale ordinary writer cannot overwrite recovered state
        run: node scripts/verify-movie-mentor-recovery-two-writer-contention.mjs
      - name: Verify synchronous legacy persistence compatibility
        if: always()
        run: node scripts/verify-movie-mentor-recovery-sync-compatibility.mjs
      - name: Verify waiting settlement authority contention
        if: always()
        run: node scripts/verify-movie-mentor-settlement-waiting-authority.mjs
      - name: Verify settlement shares recovery writer authority
        if: always()
        run: node scripts/verify-movie-mentor-settlement-recovery-shared-authority.mjs
      - name: Verify opt-in coordinated ordinary write
        if: always()
        run: node scripts/verify-movie-mentor-coordinated-ordinary-write.mjs
      - name: Verify synchronous ordinary writer guard
        if: always()
        run: node scripts/verify-movie-mentor-ordinary-write-guard.mjs
      - name: Verify asynchronous shared memory write authority
        if: always()
        run: node scripts/verify-movie-mentor-memory-write-authority.mjs
      - name: Verify strict ordinary writer fail-closed migration
        if: always()
        run: node scripts/verify-movie-mentor-strict-ordinary-writer-fence.mjs
      - name: Verify ordinary writer check-to-commit race
        if: always()
        run: node scripts/verify-movie-mentor-ordinary-write-check-commit-race.mjs
      - name: Verify real workspace coordinated Journey mode caller
        if: always()
        run: node scripts/verify-movie-mentor-workspace-coordinated-journey-caller.mjs
      - name: Verify real workspace coordinated creation caller
        if: always()
        run: node scripts/verify-movie-mentor-workspace-coordinated-creation-caller.mjs
      - name: Verify Studio coordinated project creation migration
        if: always()
        run: node scripts/verify-movie-mentor-studio-coordinated-project-creation.mjs
      - name: Verify studio project creation overlap during recovery authority
        if: always()
        run: node scripts/verify-movie-mentor-studio-project-recovery-overlap.mjs
      - name: Verify ordinary writer overlap during recovery authority
        run: node scripts/verify-movie-mentor-recovery-overlap-authority.mjs
        if: always()
      - name: Verify shared recovery and ordinary writer coordination
        if: always()
        run: node scripts/verify-movie-mentor-recovery-shared-writer-coordination.mjs
      - name: Verify Movie Mentor durable state sync
        run: npm run verify:movie-mentor-durable-sync
      - name: Verify Movie Mentor live backend turn gateway
        run: npm run verify:movie-mentor-live-gateway
      - name: Verify Movie Mentor single-brain architecture
        run: npm run verify:movie-mentor-single-brain
      - name: Verify Movie Mentor conversation UI parity
        run: npm run verify:movie-mentor-conversation-parity
      - name: Verify Movie Mentor canonical project identity
        run: npm run verify:movie-mentor-project-identity
      - name: Build frontend
        run: npm run build
