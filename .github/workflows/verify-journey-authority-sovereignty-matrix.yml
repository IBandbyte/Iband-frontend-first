name: Verify Journey Authority Sovereignty Matrix

on:
  push:
    paths:
      - "src/components/studio/**"
      - "scripts/verify-journey-*.mjs"
      - "scripts/verify-movie-mentor-acceptance-reload-reality.mjs"
      - "scripts/verify-movie-mentor-live-journey-projection.mjs"
      - ".github/workflows/verify-journey-authority-sovereignty-matrix.yml"
  pull_request:
    paths:
      - "src/components/studio/**"
      - "scripts/verify-journey-*.mjs"
      - "scripts/verify-movie-mentor-acceptance-reload-reality.mjs"
      - "scripts/verify-movie-mentor-live-journey-projection.mjs"
      - ".github/workflows/verify-journey-authority-sovereignty-matrix.yml"

jobs:
  sovereignty-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Journey Authority sovereignty matrix
        run: node scripts/verify-journey-authority-sovereignty-matrix.mjs
