name: Verify Journey Recommendation Envelope

on:
  push:
    paths:
      - "src/components/studio/mentor/JourneyRecommendationEnvelope.js"
      - "scripts/verify-journey-recommendation-envelope.mjs"
      - ".github/workflows/verify-journey-recommendation-envelope.yml"
  pull_request:
    paths:
      - "src/components/studio/mentor/JourneyRecommendationEnvelope.js"
      - "scripts/verify-journey-recommendation-envelope.mjs"
      - ".github/workflows/verify-journey-recommendation-envelope.yml"

jobs:
  recommendation-envelope:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify recommendation identity and freshness
        run: node scripts/verify-journey-recommendation-envelope.mjs
