name: Wire Live Journey Projection

on:
  push:
    paths:
      - ".github/workflows/maintenance-wire-live-journey-projection.yml"

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply wiring
        run: python scripts/maintenance-wire-live-journey-projection.py
      - name: Verify restart furnace
        run: node scripts/verify-movie-mentor-live-journey-projection.mjs
      - name: Build frontend
        run: npm ci && npm run build
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/studio/CreatorWorkspace.jsx src/components/studio/mentor/MovieMentorConversation.jsx
          git commit -m "Wire durable creator authority into live Journey" || exit 0
          git push origin HEAD:main
