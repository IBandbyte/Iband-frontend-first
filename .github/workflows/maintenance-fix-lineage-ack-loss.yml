name: One-shot Journey Authority Lineage ACK-Loss Patch

on:
  push:
    paths:
      - ".github/workflows/maintenance-fix-lineage-ack-loss.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact lineage ACK-loss patch
        run: python scripts/maintenance-fix-lineage-ack-loss.py
      - name: Commit patched lineage runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/studio/mentor/JourneyAuthoritySovereigntyLineage.js
          git diff --cached --quiet && exit 1
          git commit -m "Reconcile Journey Authority lineage ACK loss"
          git push origin HEAD:main
