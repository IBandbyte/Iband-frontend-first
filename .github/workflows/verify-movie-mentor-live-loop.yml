name: Verify Movie Mentor Live Journey Loop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/verify-movie-mentor-live-loop.mjs"
      - ".github/workflows/verify-movie-mentor-live-loop.yml"
      - "src/components/studio/mentor/MovieJourneyIntelligenceBridge.js"
      - "src/components/studio/mentor/CreatorJourneyEngine.js"

permissions:
  contents: write

jobs:
  live-journey-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify live semantic intelligence reaches canonical journey
        id: live_loop
        continue-on-error: true
        env:
          IBAND_LIVE_BACKEND_URL: https://iband-backend-first-1.onrender.com
          IBAND_LIVE_LOOP_REPORT_PATH: verification-results/movie-mentor-live-loop.json
        run: node scripts/verify-movie-mentor-live-loop.mjs

      - name: Commit live-loop verification report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification-results/movie-mentor-live-loop.json
          if git diff --cached --quiet; then
            echo "No live-loop report change to commit."
          else
            git commit -m "test: record live Movie Mentor journey loop verification"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Enforce live-loop result
        run: |
          node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync("verification-results/movie-mentor-live-loop.json","utf8")); console.log(JSON.stringify(r,null,2)); if(!r.passed) process.exit(1);'
