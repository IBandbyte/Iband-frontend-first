name: Verify Journey Recommendation Recovery Catastrophes

on:
  push:
    paths:
      - "src/components/studio/mentor/JourneyRecommendationLifecyclePersistence.js"
      - "src/components/studio/mentor/JourneyRecommendationLifecycleRecovery.js"
      - "scripts/verify-journey-recommendation-recovery-catastrophes.mjs"
      - ".github/workflows/verify-journey-recommendation-recovery-catastrophes.yml"
  pull_request:
    paths:
      - "src/components/studio/mentor/JourneyRecommendationLifecyclePersistence.js"
      - "src/components/studio/mentor/JourneyRecommendationLifecycleRecovery.js"
      - "scripts/verify-journey-recommendation-recovery-catastrophes.mjs"
      - ".github/workflows/verify-journey-recommendation-recovery-catastrophes.yml"

jobs:
  recovery-catastrophes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Torture recovery proof catastrophes
        run: node scripts/verify-journey-recommendation-recovery-catastrophes.mjs
