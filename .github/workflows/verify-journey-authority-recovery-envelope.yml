name: Verify Journey Authority Recovery Envelope

on:
  push:
    paths:
      - "src/components/studio/mentor/JourneyAuthorityRecoveryEnvelope.js"
      - "src/components/studio/mentor/JourneyDurableAuthorityStore.js"
      - "src/components/studio/mentor/JourneyAuthoritySovereigntyLineage.js"
      - "scripts/verify-journey-authority-recovery-envelope.mjs"
      - ".github/workflows/verify-journey-authority-recovery-envelope.yml"
  pull_request:
    paths:
      - "src/components/studio/mentor/JourneyAuthorityRecoveryEnvelope.js"
      - "src/components/studio/mentor/JourneyDurableAuthorityStore.js"
      - "src/components/studio/mentor/JourneyAuthoritySovereigntyLineage.js"
      - "scripts/verify-journey-authority-recovery-envelope.mjs"
      - ".github/workflows/verify-journey-authority-recovery-envelope.yml"

jobs:
  recovery-envelope:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Torture Journey Authority recovery envelope
        run: node scripts/verify-journey-authority-recovery-envelope.mjs
