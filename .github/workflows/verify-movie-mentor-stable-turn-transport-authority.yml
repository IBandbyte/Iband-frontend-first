name: Verify Movie Mentor Stable Turn Transport Authority

on:
  pull_request:
    paths:
      - "src/components/studio/mentor/MovieMentorTurnClient.js"
      - "scripts/verify-movie-mentor-stable-turn-transport-authority.mjs"
      - ".github/workflows/verify-movie-mentor-stable-turn-transport-authority.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Stable creator turn transport authority
        run: node scripts/verify-movie-mentor-stable-turn-transport-authority.mjs
