name: Verify Movie Mentor Clean Browser Server Recovery
on:
  push:
    branches:
      - verify/durable-sync-invalid-ack-20261031
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check clean browser recovery verifier
        run: node --check scripts/verify-movie-mentor-clean-browser-server-recovery.mjs
      - name: Verify empty-storage authenticated recovery transport
        run: node scripts/verify-movie-mentor-clean-browser-recovery-transport.mjs
      - name: Verify clean browser server recovery contract
        run: node scripts/verify-movie-mentor-clean-browser-server-recovery.mjs
      - name: Verify isolated recovered workspace projection
        run: node scripts/verify-movie-mentor-recovered-workspace-projection.mjs
      - name: Verify visible creator workspace reconstruction contract
        run: node scripts/verify-movie-mentor-clean-browser-workspace-reconstruction.mjs
      - name: Verify safe recovered workspace adoption fence
        run: node scripts/verify-movie-mentor-recovery-adoption-fence.mjs
      - name: Verify recovery adoption transaction freshness
        run: node scripts/verify-movie-mentor-recovery-adoption-transaction.mjs
      - name: Verify locked recovery commit refuses concurrent local changes
        run: node scripts/verify-movie-mentor-recovery-locked-commit.mjs
      - name: Verify recovery shares authority with ordinary memory writers
        run: node scripts/verify-movie-mentor-recovery-shared-writer-coordination.mjs
      - name: Verify authenticated owned-project discovery contract
        run: node scripts/verify-movie-mentor-owned-project-discovery-contract.mjs
