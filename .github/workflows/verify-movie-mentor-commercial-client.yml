name: Verify Movie Mentor Creator Commercial Client
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --no-audit --no-fund || npm i --no-audit --no-fund
      - name: Check 5A.16 syntax
        run: node --check src/components/studio/mentor/MovieMentorCommercialClient.js
      - name: Verify 5A.16 creator commercial client
        run: node scripts/verify-movie-mentor-commercial-client.mjs
      - name: Regress live Movie Mentor gateway
        run: npm run verify:movie-mentor-live-gateway
      - name: Build frontend
        run: npm run build
