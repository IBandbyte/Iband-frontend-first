name: Verify Movie Mentor Live Acceptance Races

on:
  push:
    paths:
      - "src/components/studio/CreatorWorkspace.jsx"
      - "src/components/studio/AiMentor.jsx"
      - "src/components/studio/mentor/JourneyRecommendationActionSurface.js"
      - "src/components/studio/mentor/JourneyRecommendationAcceptanceExecutionRuntime.js"
      - "src/components/studio/mentor/JourneyRecommendationAcceptanceAuthority.js"
      - "src/components/studio/mentor/JourneyProgressionExecutionRuntime.js"
      - "scripts/verify-movie-mentor-live-acceptance-races.mjs"
      - ".github/workflows/verify-movie-mentor-live-acceptance-races.yml"
  pull_request:
    paths:
      - "src/components/studio/CreatorWorkspace.jsx"
      - "src/components/studio/AiMentor.jsx"
      - "src/components/studio/mentor/JourneyRecommendationActionSurface.js"
      - "src/components/studio/mentor/JourneyRecommendationAcceptanceExecutionRuntime.js"
      - "src/components/studio/mentor/JourneyRecommendationAcceptanceAuthority.js"
      - "src/components/studio/mentor/JourneyProgressionExecutionRuntime.js"
      - "scripts/verify-movie-mentor-live-acceptance-races.mjs"
      - ".github/workflows/verify-movie-mentor-live-acceptance-races.yml"

jobs:
  live-acceptance-races:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Torture live recommendation acceptance races
        run: node scripts/verify-movie-mentor-live-acceptance-races.mjs
