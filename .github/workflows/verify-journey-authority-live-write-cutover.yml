name: Verify Journey Authority Live Write Cutover

on:
  push:
    paths:
      - "src/components/studio/mentor/JourneyProgressionExecutionRuntime.js"
      - "src/components/studio/mentor/JourneyProgressionAuthorityAdapter.js"
      - "src/components/studio/mentor/JourneyDurableAuthorityStore.js"
      - "src/components/studio/mentor/JourneyAuthorityAtomicTransition.js"
      - "src/components/studio/mentor/JourneyRecommendationAcceptanceExecutionRuntime.js"
      - "scripts/verify-journey-authority-live-write-cutover.mjs"
      - ".github/workflows/verify-journey-authority-live-write-cutover.yml"
  pull_request:
    paths:
      - "src/components/studio/mentor/JourneyProgressionExecutionRuntime.js"
      - "src/components/studio/mentor/JourneyProgressionAuthorityAdapter.js"
      - "src/components/studio/mentor/JourneyDurableAuthorityStore.js"
      - "src/components/studio/mentor/JourneyAuthorityAtomicTransition.js"
      - "src/components/studio/mentor/JourneyRecommendationAcceptanceExecutionRuntime.js"
      - "scripts/verify-journey-authority-live-write-cutover.mjs"
      - ".github/workflows/verify-journey-authority-live-write-cutover.yml"

jobs:
  authority-live-write-cutover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Torture live Journey Authority write cutover
        run: node scripts/verify-journey-authority-live-write-cutover.mjs
