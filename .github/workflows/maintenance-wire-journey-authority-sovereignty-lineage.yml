name: One-shot Journey Authority Sovereignty Lineage Integration

on:
  push:
    paths:
      - ".github/workflows/maintenance-wire-journey-authority-sovereignty-lineage.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact lineage integration patch
        run: python scripts/maintenance-wire-journey-authority-sovereignty-lineage.py
      - name: Commit patched authority store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/studio/mentor/JourneyDurableAuthorityStore.js
          git diff --cached --quiet && exit 1
          git commit -m "Integrate Journey Authority sovereignty lineage"
          git push origin HEAD:main
