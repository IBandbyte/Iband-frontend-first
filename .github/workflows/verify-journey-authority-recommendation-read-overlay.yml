name: Verify Journey Authority Recommendation Read Overlay

on:
  push:
    paths:
      - "src/components/studio/mentor/CreatorMemory.js"
      - "src/components/studio/mentor/JourneyAuthorityReadFacade.js"
      - "scripts/verify-journey-authority-recommendation-read-overlay.mjs"
      - ".github/workflows/verify-journey-authority-recommendation-read-overlay.yml"
  pull_request:
    paths:
      - "src/components/studio/mentor/CreatorMemory.js"
      - "src/components/studio/mentor/JourneyAuthorityReadFacade.js"
      - "scripts/verify-journey-authority-recommendation-read-overlay.mjs"
      - ".github/workflows/verify-journey-authority-recommendation-read-overlay.yml"

jobs:
  authority-recommendation-read-overlay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Torture authority-first recommendation lifecycle reads
        run: node scripts/verify-journey-authority-recommendation-read-overlay.mjs
