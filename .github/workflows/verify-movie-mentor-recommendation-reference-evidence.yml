name: Verify Movie Mentor Recommendation Reference Evidence

on:
  push:
    branches: [main]
    paths:
      - "src/components/studio/mentor/MovieMentorStudioIdentityRuntime.js"
      - "src/components/studio/mentor/MovieJourneyIntelligenceBridge.js"
      - "src/components/studio/mentor/CreatorMemory.js"
      - "src/components/studio/mentor/CreatorMemoryCore.js"
      - "src/components/studio/mentor/MovieMentorDurableStateSync.js"
      - "scripts/verify-movie-mentor-recommendation-reference-evidence.mjs"
      - ".github/workflows/verify-movie-mentor-recommendation-reference-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Check recommendation reference evidence syntax
        run: node --check src/components/studio/mentor/MovieMentorStudioIdentityRuntime.js && node --check scripts/verify-movie-mentor-recommendation-reference-evidence.mjs
      - name: Verify recommendation reference evidence persistence
        run: node scripts/verify-movie-mentor-recommendation-reference-evidence.mjs
