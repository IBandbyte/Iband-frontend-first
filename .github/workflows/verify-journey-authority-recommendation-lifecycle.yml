name: Verify Journey Authority Recommendation Lifecycle

on:
  push:
    paths:
      - "src/components/studio/mentor/JourneyAuthorityRecommendationLifecycle.js"
      - "scripts/verify-journey-authority-recommendation-lifecycle.mjs"
      - ".github/workflows/verify-journey-authority-recommendation-lifecycle.yml"
  pull_request:
    paths:
      - "src/components/studio/mentor/JourneyAuthorityRecommendationLifecycle.js"
      - "scripts/verify-journey-authority-recommendation-lifecycle.mjs"
      - ".github/workflows/verify-journey-authority-recommendation-lifecycle.yml"

jobs:
  authority-recommendation-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Torture authority recommendation lifecycle
        run: node scripts/verify-journey-authority-recommendation-lifecycle.mjs
