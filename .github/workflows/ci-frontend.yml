name: CI (Frontend)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm i --no-audit --no-fund
      - name: Verify Movie Mentor closed loop
        run: npm run verify:movie-mentor
      - name: Verify Movie Mentor specialist agent orchestration
        run: npm run verify:movie-mentor-agents
      - name: Verify Movie Mentor specialist execution adapter
        run: npm run verify:movie-mentor-agent-execution
      - name: Verify Movie Mentor synthesis integration
        run: npm run verify:movie-mentor-synthesis
      - name: Verify Movie Mentor creator-facing integration
        run: npm run verify:movie-mentor-creator-facing
      - name: Verify Movie Mentor durable state sync
        run: npm run verify:movie-mentor-durable-sync
      - name: Verify Movie Mentor live gateway continuity transport
        run: npm run verify:movie-mentor-live-gateway
      - name: Verify Movie Mentor live Journey authority projection
        run: node scripts/verify-movie-mentor-live-journey-projection.mjs
      - name: Build frontend
        run: npm run build
