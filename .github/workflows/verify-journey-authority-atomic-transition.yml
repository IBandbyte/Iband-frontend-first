name: Verify Journey Authority Atomic Transition

on:
  push:
    paths:
      - "src/components/studio/mentor/JourneyDurableAuthorityStore.js"
      - "src/components/studio/mentor/JourneyAuthorityRecommendationLifecycle.js"
      - "src/components/studio/mentor/JourneyAuthorityAtomicTransition.js"
      - "scripts/verify-journey-authority-atomic-transition.mjs"
      - ".github/workflows/verify-journey-authority-atomic-transition.yml"
  pull_request:
    paths:
      - "src/components/studio/mentor/JourneyDurableAuthorityStore.js"
      - "src/components/studio/mentor/JourneyAuthorityRecommendationLifecycle.js"
      - "src/components/studio/mentor/JourneyAuthorityAtomicTransition.js"
      - "scripts/verify-journey-authority-atomic-transition.mjs"
      - ".github/workflows/verify-journey-authority-atomic-transition.yml"

jobs:
  authority-atomic-transition:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Torture atomic Journey authority transitions
        run: node scripts/verify-journey-authority-atomic-transition.mjs
