name: Verify Movie Mentor Outbox Committed Snapshot Digest
on:
  push:
    branches:
      - verify/response-memory-injection-courts-6c98ab76
  workflow_dispatch:
jobs:
  committed-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify digest binds committed and rehydrated state
        run: node scripts/verify-movie-mentor-outbox-committed-snapshot-digest.mjs
