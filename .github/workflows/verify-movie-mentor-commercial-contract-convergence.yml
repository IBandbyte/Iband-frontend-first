name: Verify Movie Mentor Commercial Contract Convergence
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --no-audit --no-fund || npm i --no-audit --no-fund
      - name: Verify 5A.18 frontend-backend commercial envelope convergence
        run: node scripts/verify-movie-mentor-commercial-client.mjs
      - name: Regress 5A.17 creator commercial surface
        run: node scripts/verify-movie-mentor-commercial-surface.mjs
      - name: Regress live Movie Mentor gateway
        run: npm run verify:movie-mentor-live-gateway
      - name: Build frontend
        run: npm run build
