name: Verify Movie Mentor Publication Outbox Snapshot Binding
on:
  push:
    branches:
      - verify/response-memory-injection-courts-6c98ab76
  workflow_dispatch:
jobs:
  snapshot-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify committed snapshot binding
        run: node scripts/verify-movie-mentor-publication-outbox-snapshot-binding.mjs
