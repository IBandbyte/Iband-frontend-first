name: Verify response memory injection physical courts
on:
  push:
    branches:
      - verify/response-memory-injection-courts-6c98ab76
  workflow_dispatch:
jobs:
  injection-courts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Physical unsafe memory injection denial
        run: node scripts/verify-movie-mentor-response-generator-injected-memory-physical.mjs
      - name: Physical unrecognised writer denial
        run: node scripts/verify-movie-mentor-unrecognised-injected-writer.mjs
      - name: Strict memory authority contract
        run: node scripts/verify-movie-mentor-response-generator-strict-memory-authority.mjs
      - name: Live Studio writer reachability contract
        run: node scripts/verify-movie-mentor-live-studio-writer-reachability.mjs
      - name: Strict synchronous writer versus recovery overlap
        run: node scripts/verify-movie-mentor-strict-ordinary-recovery-overlap.mjs
      - name: Coordinated writer versus recovery lock overlap
        run: node scripts/verify-movie-mentor-coordinated-writer-overlap.mjs
      - name: Production writer cutover boundary inventory
        run: node scripts/verify-movie-mentor-production-writer-cutover-boundary.mjs
      - name: Ordinary writer migration inventory
        run: node scripts/verify-movie-mentor-ordinary-writer-migration-inventory.mjs
      - name: Studio legacy writer reachability inventory
        run: node scripts/verify-movie-mentor-studio-legacy-writer-reachability.mjs
      - name: Permissive caller reachability boundary
        run: node scripts/verify-movie-mentor-permissive-caller-reachability.mjs
      - name: Lifecycle recovery caller authority boundary
        run: node scripts/verify-movie-mentor-lifecycle-caller-authority.mjs
      - name: Retained permissive memory reference rejection
        run: node scripts/verify-movie-mentor-response-generator-retained-memory-reference.mjs
      - name: Physical strict lifecycle write-denial court
        run: node scripts/verify-movie-mentor-lifecycle-strict-write-physical.mjs
