name: Verify Movie Mentor Creator Stage Selection

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/verify-movie-mentor-creator-stage-selection.mjs"
      - ".github/workflows/verify-movie-mentor-creator-stage-selection.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/verify-movie-mentor-creator-stage-selection.mjs"
      - ".github/workflows/verify-movie-mentor-creator-stage-selection.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  creator-stage-selection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify creator stage selection uses canonical transactional progression
        run: node scripts/verify-movie-mentor-creator-stage-selection.mjs
