name: Verify Journey Recommendation Canonical Identity

on:
  push:
    paths:
      - "src/components/studio/mentor/JourneyRecommendationIdentity.js"
      - "src/components/studio/mentor/JourneyRecommendationEnvelope.js"
      - "src/components/studio/mentor/MovieMentorStudioIdentityRuntime.js"
      - "src/components/studio/mentor/JourneyRecommendationAcceptanceExecutionRuntime.js"
      - "scripts/verify-journey-recommendation-canonical-identity.mjs"
      - ".github/workflows/verify-journey-recommendation-canonical-identity.yml"
  pull_request:
    paths:
      - "src/components/studio/mentor/JourneyRecommendationIdentity.js"
      - "src/components/studio/mentor/JourneyRecommendationEnvelope.js"
      - "src/components/studio/mentor/MovieMentorStudioIdentityRuntime.js"
      - "src/components/studio/mentor/JourneyRecommendationAcceptanceExecutionRuntime.js"
      - "scripts/verify-journey-recommendation-canonical-identity.mjs"
      - ".github/workflows/verify-journey-recommendation-canonical-identity.yml"

jobs:
  canonical-recommendation-identity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify canonical recommendation identity
        run: node scripts/verify-journey-recommendation-canonical-identity.mjs
