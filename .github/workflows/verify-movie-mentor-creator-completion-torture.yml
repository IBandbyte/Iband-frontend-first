name: Verify Movie Mentor Creator Completion Torture

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/verify-movie-mentor-creator-completion-torture.mjs"
      - ".github/workflows/verify-movie-mentor-creator-completion-torture.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/verify-movie-mentor-creator-completion-torture.mjs"
      - ".github/workflows/verify-movie-mentor-creator-completion-torture.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  creator-completion-torture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Torture explicit creator Journey completion
        run: node scripts/verify-movie-mentor-creator-completion-torture.mjs
